<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 数字 7 -->
  <text x="8" y="90" font-family="Arial, sans-serif" font-weight="bold" font-size="90"
        fill="url(#grad)" transform="rotate(-5, 60, 60)">7</text>
  
  <!-- 字母 ye -->
  <text x="70" y="95" font-family="Arial, sans-serif" font-weight="bold" font-size="40"
        fill="url(#grad)" transform="rotate(-5, 60, 60)">ye</text>
</svg>